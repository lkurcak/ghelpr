[package]
name = "ghelpr"
version = "0.1.5"
edition = "2024"
description = "CLI tool for working with GitHub pull requests"
license = "MIT"
repository = "https://github.com/lkurcak/ghelpr"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
